<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RTSEngine</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1214; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #cfd6dc; font: 15px system-ui, sans-serif; pointer-events: none; }
</style>
<script>
  // Native-plugin registry stub: plugin scripts may load before the engine; the engine takes over
  // RTSPlugins.emit at startup and replays queued events.
  window.RTSPlugins = window.RTSPlugins || { plugins: {}, queue: [],
    register: function (name, impl) { this.plugins[name] = impl; },
    emit: function (plugin, event, data) { this.queue.push([plugin, event, data]); } };
</script>
<!-- rtsbuild inserts the plugins' <script> tags right after this marker (comments don't survive minification) -->
<meta name="rts-plugin-scripts" content="">
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
  // URL query → command line, e.g. index.html?map=0&spectate → --map 0 --spectate
  function argsFromQuery() {
    var a = [];
    new URLSearchParams(location.search).forEach(function (v, k) { a.push('--' + k); if (v) a.push(v); });
    return a;
  }
  if (!document.createElement('canvas').getContext('webgl2'))
    document.getElementById('status').textContent = 'Нужен браузер с поддержкой WebGL 2';
  var Module = {
    arguments: argsFromQuery(),
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { var s = document.getElementById('status'); s.textContent = t; s.style.display = t ? 'flex' : 'none'; },
    monitorRunDependencies: function (left) { if (!left) Module.setStatus(''); },
    onRuntimeInitialized: function () { Module.setStatus(''); Module.canvas.focus(); }
  };
  window.onerror = function () { Module.setStatus('Error: see the browser console'); };
</script>
{{{ SCRIPT }}}
</body>
</html>
