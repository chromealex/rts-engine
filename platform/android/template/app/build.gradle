plugins {
    id 'com.android.application'
}

android {
    namespace '@APP_ID@'
    compileSdk 35
@NDK_VERSION_LINE@
    defaultConfig {
        applicationId '@APP_ID@'
        minSdk 26
        targetSdk 35
        versionCode @VERSION_CODE@
        versionName '@VERSION@'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DRTS_CONTENT_DIR=' + file('src/main/assets/content').absolutePath,
                          '-DRTS_BUILD_EDITOR=OFF', '-DRTS_BUILD_TOOLS=OFF', '-DRTS_BUILD_TESTS=OFF', '-DRTS_BUILD_HEADLESS=OFF',
                          '-DANDROID_STL=c++_static'
            }
        }
    }
    // Store builds: RTS_KEYSTORE (path to .jks), RTS_KEYSTORE_PASSWORD, RTS_KEY_ALIAS, RTS_KEY_PASSWORD
    // (the release workflow sets them from GitHub secrets). Without them release is signed with the
    // debug key, so the APK still installs out of the box.
    signingConfigs {
        release {
            def ks = System.getenv('RTS_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('RTS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RTS_KEY_ALIAS')
                keyPassword System.getenv('RTS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('RTS_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
@CMAKE_VERSION_LINE@
        }
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    androidResources { noCompress += ['json', 'ttf', 'rpak'] } // rpak: mapped straight from the APK
}
