plugins {
    id 'com.android.application'
}

android {
    namespace '@APP_ID@'
    compileSdk 35
@NDK_VERSION_LINE@
    defaultConfig {
        applicationId '@APP_ID@'
        minSdk 26
        targetSdk 35
        versionCode @VERSION_CODE@
        versionName '@VERSION@'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DRTS_CONTENT_DIR=' + file('src/main/assets/content').absolutePath,
                          '-DRTS_BUILD_EDITOR=OFF', '-DRTS_BUILD_TOOLS=OFF', '-DRTS_BUILD_TESTS=OFF', '-DRTS_BUILD_HEADLESS=OFF',
                          '-DANDROID_STL=c++_static'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Uses the debug key so the APK installs out of the box; set up your own signingConfig for the store.
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
@CMAKE_VERSION_LINE@
        }
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    androidResources { noCompress += ['json', 'ttf', 'rpak'] } // rpak: mapped straight from the APK
}
