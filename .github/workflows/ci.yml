# RTSEngine CI: builds every platform, runs tests and bot matches, smoke-runs the game on
# Android (emulator) and Web (headless Chromium), and checks that the simulation is bit-identical
# everywhere (the "determinism" job diffs headless checksums from all platforms).
name: CI

on:
  push:
    branches: [master, 'agent-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     arch: x64,   cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04,     arch: x64,   cc: clang, cxx: clang++ }
          - { os: ubuntu-24.04-arm, arch: arm64, cc: gcc,   cxx: g++ }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build libx11-dev libegl-dev libgles-dev xvfb
      - name: Configure
        run: cmake --preset linux-release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/linux-release
      - name: Tests
        run: build/linux-release/rts_tests
      - name: Bot matches
        run: .github/scripts/headless-checksums.sh build/linux-release/rts_headless checksums-linux-${{ matrix.arch }}-${{ matrix.cc }}.txt
      - name: Screenshot (Xvfb, software GL)
        if: matrix.cc == 'gcc'
        run: |
          Xvfb :97 -screen 0 1280x800x24 & sleep 1
          for g in skirmish mushrooms; do
            DISPLAY=:97 RTS_CONTENT=games/$g RTS_SHADOWS=medium RTS_SCREENSHOT=shot-$g.ppm RTS_EXIT_AFTER_FRAMES=300 \
              timeout 300 build/linux-release/RTSGame --map 0 --spectate
          done
          python3 .github/scripts/check-screenshot.py shot-*.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-linux-${{ matrix.arch }}-${{ matrix.cc }}
          path: checksums-*.txt
      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: screenshots-linux-${{ matrix.arch }}
          path: shot-*.png

  # ---------------------------------------------------------------- Windows
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build build/windows-msvc --config Release
      - name: Tests
        run: build/windows-msvc/Release/rts_tests.exe
      - name: Bot matches
        shell: bash
        run: .github/scripts/headless-checksums.sh build/windows-msvc/Release/rts_headless.exe checksums-windows-msvc.txt
      - name: Package (rtsbuild)
        run: build/windows-msvc/Release/rtsbuild.exe --project games/skirmish --target windows --out dist
      - uses: actions/upload-artifact@v4
        with: { name: checksums-windows-msvc, path: checksums-*.txt }
      - uses: actions/upload-artifact@v4
        with: { name: game-windows, path: dist/windows }

  windows-mingw:
    name: Windows MinGW (cross, Wine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build mingw-w64 wine64
      - name: Build
        run: |
          cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=platform/cmake/mingw-w64.cmake -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build/mingw
      - name: Tests and bot matches under Wine
        env: { WINEDEBUG: -all }
        run: |
          wine build/mingw/rts_tests.exe
          .github/scripts/headless-checksums.sh "wine build/mingw/rts_headless.exe" checksums-windows-mingw.txt
      - uses: actions/upload-artifact@v4
        with: { name: checksums-windows-mingw, path: checksums-*.txt }

  # ---------------------------------------------------------------- Apple
  macos:
    name: macOS + iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, Xcode)
        run: |
          cmake --preset macos
          cmake --build build/macos --config Release -- -quiet
      - name: Tests
        run: build/macos/Release/rts_tests
      - name: Bot matches
        run: .github/scripts/headless-checksums.sh build/macos/Release/rts_headless checksums-macos-arm64.txt
      - name: Package .app and iOS project (rtsbuild)
        run: |
          build/macos/Release/rtsbuild --project games/skirmish --target macos --out dist
          build/macos/Release/rtsbuild --project games/skirmish --target ios --out dist
      - uses: actions/upload-artifact@v4
        with: { name: checksums-macos-arm64, path: checksums-*.txt }
      - uses: actions/upload-artifact@v4
        with: { name: game-macos, path: dist/macos }

  # ---------------------------------------------------------------- Android
  android:
    name: Android APK + emulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Host tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DRTS_BUILD_CLIENT=OFF -DRTS_BUILD_EDITOR=OFF -DRTS_BUILD_TESTS=OFF -DRTS_BUILD_HEADLESS=OFF
          cmake --build build/host --target rtsbuild
      - name: Native library (NDK, arm64)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cmake --preset android-arm64 -DRTS_BUILD_EDITOR=OFF -DRTS_BUILD_TOOLS=OFF -DRTS_BUILD_HEADLESS=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build/android-arm64
      - name: APK (rtsbuild → Gradle)
        run: build/host/rtsbuild --project games/skirmish --target android --out dist
      - uses: actions/upload-artifact@v4
        with: { name: game-android, path: dist/android/*.apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-smoke.sh dist/android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-smoke, path: android-smoke/ }

  # ---------------------------------------------------------------- Web
  web:
    name: Web (Emscripten) + Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74 }
      - name: Build
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release -DRTS_BUILD_EDITOR=OFF -DRTS_BUILD_TOOLS=OFF -DRTS_BUILD_TESTS=OFF -DRTS_BUILD_HEADLESS=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build/web
          ls -la build/web/index.*
      - name: Smoke test in headless Chromium
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node platform/web/smoke.mjs build/web web-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: game-web, path: "build/web/index.*\nweb-smoke/" }

  # ---------------------------------------------------------------- Native plugins (docs/plugins.md)
  # Compiles every plugin against the real SDKs: Gradle (Play Billing, RuStore Pay, AdMob, Yandex Ads,
  # AppLovin MAX, ironSource LevelPlay) and CocoaPods + Xcode (StoreKit, AdMob, Yandex Ads, AppLovin,
  # ironSource). Test ad ids only. Then checks that unselected plugins never get into a build.
  plugins-android:
    name: Plugins (Android SDKs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build APK with all Android plugins
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DRTS_BUILD_CLIENT=OFF -DRTS_BUILD_EDITOR=OFF -DRTS_BUILD_TESTS=OFF -DRTS_BUILD_HEADLESS=OFF
          cmake --build build/host --target rtsbuild
          python3 .github/scripts/plugins-testgame.py build/plugins-game
          build/host/rtsbuild --project build/plugins-game --target android --out build/plugins-dist --config Debug
          ls -la build/plugins-dist/android/*.apk
      - name: Only selected plugins get into a build
        run: python3 .github/scripts/check-plugin-isolation.py build/host/rtsbuild build/isolation
      - name: Yandex Games plugin protocol
        run: node plugins/yandex-games/web/test.mjs

  plugins-ios:
    name: Plugins (iOS SDKs)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project + CocoaPods + simulator build with all iOS plugins
        run: |
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DRTS_BUILD_CLIENT=OFF -DRTS_BUILD_EDITOR=OFF -DRTS_BUILD_TESTS=OFF -DRTS_BUILD_HEADLESS=OFF
          cmake --build build/host --target rtsbuild
          python3 .github/scripts/plugins-testgame.py build/plugins-game
          build/host/rtsbuild --project build/plugins-game --target ios --out build/plugins-dist --plugins appstore,admob,yandex-ads,applovin,ironsource

  # ---------------------------------------------------------------- Cross-platform determinism
  determinism:
    name: Determinism across platforms
    needs: [linux, windows-msvc, windows-mingw, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: checksums-*, merge-multiple: true }
      - name: Compare checksums
        run: |
          ls checksums-*.txt
          ref=checksums-linux-x64-gcc.txt
          ok=1
          for f in checksums-*.txt; do
            if ! diff -u "$ref" "$f"; then echo "::error::$f differs from $ref"; ok=0; fi
          done
          [ $ok = 1 ] && echo "All platforms produce identical simulations."
          [ $ok = 1 ]
